<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean English Application</title>
    <!-- Library untuk kompresi data URL agar link tidak terpotong -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f8ff; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2 { color: #006699; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        input, select, button { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { background-color: #008cba; color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #005f73; }
        .btn-success { background-color: #2e7d32; }
        .btn-success:hover { background-color: #1b5e20; }
        .topic-card { background: #eef9ff; border-left: 5px solid #008cba; padding: 10px 15px; margin-bottom: 10px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .topic-card img { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; margin-right: 10px; }
        .badge { background: #008cba; color: white; padding: 3px 8px; border-radius: 12px; font-size: 12px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <!-- PANEL TEACHER SETUP -->
    <div id="teacherPanel">
        <h1>⚙️ Teacher Setup Panel</h1>
        
        <div class="form-group">
            <label for="targetLevelInput">1. Target Level Class:</label>
            <input type="text" id="targetLevelInput" placeholder="e.g., Grade 1 - International Class">
        </div>

        <div class="form-group" style="display: flex; gap: 10px;">
            <div style="flex: 1;">
                <label for="startDateInput">2. Start Date:</label>
                <input type="date" id="startDateInput">
            </div>
            <div style="flex: 1;">
                <label for="dueDateInput">3. Due Date:</label>
                <input type="date" id="dueDateInput">
            </div>
        </div>

        <div class="form-group">
            <label for="voiceSelect">4. Voice Accent:</label>
            <select id="voiceSelect">
                <option value="en-US">English (US)</option>
                <option value="en-GB">English (UK)</option>
            </select>
        </div>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ddd;">

        <h2>📚 Add Topic / Vocabulary</h2>
        <div class="form-group">
            <label for="topicWord">English Word / Phrase:</label>
            <input type="text" id="topicWord" placeholder="e.g., Dolphin">
        </div>
        <div class="form-group">
            <label for="topicTranslation">Indonesian Translation:</label>
            <input type="text" id="topicTranslation" placeholder="e.g., Lumba-lumba">
        </div>
        <div class="form-group">
            <label for="topicImage">Image URL or Emoji (Recommended):</label>
            <input type="text" id="topicImage" placeholder="e.g., 🐬 or https://example.com/dolphin.jpg">
        </div>
        
        <button type="button" onclick="addTopic()">➕ Save Topic</button>

        <h3 style="margin-top: 20px;">5. Created Topics List (<span id="topicCount">0</span>)</h3>
        <div id="topicListDisplay">
            <p style="color: #777; font-style: italic;">No topics added yet.</p>
        </div>

        <hr style="margin: 25px 0; border: 0; border-top: 2px dashed #008cba;">

        <button type="button" class="btn-success" onclick="generateShareableLink()" style="padding: 15px; font-size: 16px;">
            🔗 Generate Shareable Link for Students
        </button>
    </div>

    <!-- PANEL STUDENT VIEW (Otomatis Aktif jika Membuka Link Siswa) -->
    <div id="studentPanel" class="hidden">
        <h1 id="studentTitle">🌊 Ocean English Practice</h1>
        <div id="studentMeta" style="background: #eef; padding: 10px; border-radius: 6px; margin-bottom: 20px;"></div>
        
        <h2>Practice Topics:</h2>
        <div id="studentTopicContainer"></div>
    </div>
</div>

<script>
    // Global Array untuk menyimpan seluruh topik
    let vocabList = [];

    // Fungsi Menambahkan Topik ke Array Global & Tampilan (Struktur data persis seperti semula)
    function addTopic() {
        const word = document.getElementById('topicWord').value.trim();
        const translation = document.getElementById('topicTranslation').value.trim();
        const image = document.getElementById('topicImage').value.trim() || '📖';

        if (!word) {
            alert("Harap isi English Word terlebih dahulu!");
            return;
        }

        // Tambah ke array dengan properti asli
        const topicObj = { id: Date.now(), word, translation, image };
        vocabList.push(topicObj);

        // Reset form input
        document.getElementById('topicWord').value = '';
        document.getElementById('topicTranslation').value = '';
        document.getElementById('topicImage').value = '';

        renderTeacherTopicList();
    }

    // Fungsi Render Daftar Topik di Panel Guru
    function renderTeacherTopicList() {
        const container = document.getElementById('topicListDisplay');
        document.getElementById('topicCount').innerText = vocabList.length;

        if (vocabList.length === 0) {
            container.innerHTML = `<p style="color: #777; font-style: italic;">No topics added yet.</p>`;
            return;
        }

        container.innerHTML = vocabList.map((item, index) => `
            <div class="topic-card">
                <div style="display: flex; align-items: center;">
                    <span style="font-size: 24px; margin-right: 12px;">${item.image.startsWith('http') ? `<img src="${item.image}" alt="img">` : item.image}</span>
                    <div>
                        <strong>${index + 1}. ${item.word}</strong><br>
                        <small style="color: #555;">${item.translation}</small>
                    </div>
                </div>
                <button onclick="removeTopic(${item.id})" style="width: auto; background: #d9534f; padding: 5px 10px; margin: 0;">Hapus</button>
            </div>
        `).join('');
    }

    // Hapus Topik berdasarkan ID
    function removeTopic(id) {
        vocabList = vocabList.filter(t => t.id !== id);
        renderTeacherTopicList();
    }

    // FUNGSI UTAMA: GENERATE LINK SISWA LENGKAP & OPTIMAL
    function generateShareableLink() {
        if (vocabList.length === 0) {
            alert("⚠️ Harap tambahkan minimal 1 topik sebelum membuat link!");
            return;
        }

        // Seluruh fitur & properti asli dipertahankan secara utuh
        const config = {
            level: document.getElementById('targetLevelInput').value || 'General Class',
            start: document.getElementById('startDateInput').value || '-',
            due: document.getElementById('dueDateInput').value || '-',
            voice: document.getElementById('voiceSelect').value,
            topics: vocabList
        };

        try {
            // Menggunakan compressToBase64 (jauh lebih efisien dari compressToEncodedURIComponent)
            // Tanpa merusak struktur JSON asli
            const jsonString = JSON.stringify(config);
            const compressedData = LZString.compressToBase64(jsonString);
            
            const baseUrl = window.location.href.split('?')[0];
            // Format URL aman untuk HP dan menyertakan mode=student
            const studentUrl = `${baseUrl}?mode=student&data=${encodeURIComponent(compressedData)}`;

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(studentUrl).then(() => {
                    alert("✅ Success! Link siswa berhasil disalin ke clipboard.\n\nSemua topik dan settingan telah tersimpan di dalam link.");
                }).catch(() => {
                    promptManualCopy(studentUrl);
                });
            } else {
                promptManualCopy(studentUrl);
            }
        } catch (err) {
            console.error("Gagal meng-generate link:", err);
            alert("❌ Terjadi kesalahan saat memproses link.");
        }
    }

    function promptManualCopy(url) {
        prompt("✅ Link Siswa Berhasil Dibuat!\nSalin link di bawah ini dan bagikan ke siswa:", url);
    }

    // FUNGSI LOAD DATA PADA SISI SISWA (Mendukung format lama & format kompresi Base64 baru)
    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const compressedData = urlParams.get('data');
        const mode = urlParams.get('mode');

        if (compressedData && mode === 'student') {
            try {
                let decompressedJson = null;
                const rawData = decodeURIComponent(compressedData);

                // Try 1: Dekompresi metode baru (Base64 - Sangat Ringkas)
                decompressedJson = LZString.decompressFromBase64(rawData);

                // Try 2: Fallback ke metode lama jika membuka link versi terdahulu
                if (!decompressedJson) {
                    decompressedJson = LZString.decompressFromEncodedURIComponent(compressedData);
                }

                if (!decompressedJson) throw new Error("Data korup");

                const config = JSON.parse(decompressedJson);

                // Sembunyikan Panel Guru, Tampilkan Panel Siswa
                document.getElementById('teacherPanel').classList.add('hidden');
                document.getElementById('studentPanel').classList.remove('hidden');

                // Tampilkan Informasi Kelas (Menggunakan voiceAccent & meta data lengkap)
                document.getElementById('studentMeta').innerHTML = `
                    <strong>Class Level:</strong> ${config.level} | 
                    <strong>Start:</strong> ${config.start} | 
                    <strong>Due:</strong> ${config.due} | 
                    <strong>Voice:</strong> <span class="badge">${config.voice}</span>
                `;

                // Render Topik untuk Siswa
                const studentTopicContainer = document.getElementById('studentTopicContainer');
                if (config.topics && config.topics.length > 0) {
                    studentTopicContainer.innerHTML = config.topics.map((item, idx) => `
                        <div class="topic-card">
                            <div style="display: flex; align-items: center;">
                                <span style="font-size: 28px; margin-right: 15px;">
                                    ${item.image.startsWith('http') ? `<img src="${item.image}" alt="img">` : item.image}
                                </span>
                                <div>
                                    <h3 style="margin: 0; color: #006699;">${idx + 1}. ${item.word}</h3>
                                    <p style="margin: 3px 0 0 0; color: #666;">${item.translation}</p>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    studentTopicContainer.innerHTML = `<p>Tidak ada topik dalam tugas ini.</p>`;
                }

            </div> catch (e) {
                console.error("Gagal membaca data link siswa:", e);
                alert("❌ Link tidak valid atau data topik telah rusak.");
            }
        }
    });
</script>

</body>
</html>
